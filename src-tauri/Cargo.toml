[package]
name = "elefante"
version = "1.0.0"
authors = ["Rick-dev"]
description = "Elefante — ambiente local de desenvolvimento web, criado por Rick-dev"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
